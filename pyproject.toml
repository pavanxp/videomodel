[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-diversity"
version = "0.1.0"
description = "Score a delivery of egocentric video clips for visual diversity and report duplicate clusters."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Core runtime. Deliberately light: the pipeline runs end-to-end on these alone,
# using the numpy search backend and the deterministic stub embedder. The heavy
# model/index/API stacks are extras so CI and offline runs stay installable.
dependencies = [
    "pydantic>=2.6,<3.0",
    "numpy>=1.24,<3.0",
    "networkx>=3.1,<4.0",
    "PyYAML>=6.0,<7.0",
    "Pillow>=10.0,<12.0",
]

[project.optional-dependencies]
# Real embeddings (DINOv2, optional CLIP).
embed = [
    "torch>=2.1,<3.0",
    "transformers>=4.38,<5.0",
]
# Approximate/large-scale nearest-neighbour search.
faiss = ["faiss-cpu>=1.7,<2.0"]
# Stage 12 borderline review.
llm = ["openai>=1.30,<3.0"]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=4.1,<8.0",
]
all = [
    "visual-diversity[embed,faiss,llm,dev]",
]

[project.scripts]
visual-diversity = "visual_diversity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
